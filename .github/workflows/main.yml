name: FirstWorkflow

on: push

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Hello World
        run: echo "Hello from GH-200 session"

      - name: Checkout
        uses: actions/checkout@v6

      - name: List files
        run: ls -la

      - name: Install Package
        run: |
          sudo apt-get install -y figlet
          figlet -f slant "GH-200 CoHack"
          echo "----------------------------"
          figlet -f digital "GitHub Actions"
